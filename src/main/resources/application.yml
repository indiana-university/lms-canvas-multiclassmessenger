spring:
  application:
    name: lms-lti-multiclassmessenger
  config.import: optional:${app.fullFilePath}/${app.overridesFileName}, optional:${app.fullFilePath}/security.properties, classpath:canvas.properties, optional:classpath:git.properties, classpath:lti-registrations.properties
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
  datasource:
    url: ${lms.db.url}
    username: ${lms.db.user}
    password: ${lms.db.password}
    type: ${lms.db.poolType}
  cloud.vault.enabled: false
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${oauth.tokenprovider.url}/.well-known/jwks.json
      client:
        registration:
          lms_canvas_oauth2_multiclassmessenger:
            client-id: ${canvas.oauth2.clientId}
            client-secret: ${canvas.oauth2.clientSecret}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - url:GET|/api/v1/courses/:id
              - url:GET|/api/v1/users/:user_id/courses
              - url:GET|/api/v1/courses/:course_id/files/quota
              - url:GET|/api/v1/users/:user_id/files/quota
              - url:POST|/api/v1/courses/:course_id/discussion_topics
              - url:POST|/api/v1/conversations
              - url:POST|/api/v1/users/:user_id/files
              - url:GET|/api/v1/files/:id
        provider:
          lms_canvas_oauth2_multiclassmessenger:
            authorization-uri: ${canvas.baseUrl}/login/oauth2/auth
            token-uri: ${canvas.baseUrl}/login/oauth2/token
  web.error.whitelabel.enabled: false
# canvas.oauth2.enabled only gates the CanvasRestTemplateAsUser bean. @EnableCanvasOAuth2Client (on
# WebApplication) always needs canvas.oauth2.encryptionPassword/encryptionSalt, which come from
# security.properties like the other secrets (see viewem's application.yml for the full explanation).
canvas:
  oauth2:
    enabled: true
    clientId: ${canvas.oauth2.clientId.multiclassmessenger}
    clientSecret: ${canvas.oauth2.clientSecret.multiclassmessenger}

multiclassmessenger:
  version: @app.version@
  env: ${app.env}

server:
  servlet:
    session:
      timeout: 30m

app:
  env: dev
  fullFilePath: file:/usr/src/app/config
  overridesFileName: overrides.properties

management:
  endpoint.lms.enabled: true
  endpoints.web.exposure.include: health,lms
  health.redis.enabled: false
  info.java.enabled: true

---

spring:
  config.activate.on-profile: redis-session
  session:
    data:
      redis:
        namespace: mcm-@app.version@:session
management.health.redis.enabled: true

---

spring:
  config:
    activate.on-profile: vault
    import: vault://
  cloud.vault:
    enabled: true
    config:
      lifecycle.lease-endpoints: leases
    generic:
      enabled: false
    kv:
      enabled: true
      backend: ua-vpit/enterprise-systems/lms/kv
      application-name: lms-lti-multiclassmessenger

---

spring:
  config:
    activate.on-profile: swagger
springdoc:
  api-docs:
    enabled: true
    path: /api/v3/api-docs
  cache.disabled: true
  packagesToScan: edu.iu.uits.lms.multiclassmessenger.rest
  swagger-ui:
    enabled: false
    disable-swagger-default-url: true
    path: /api/swagger-ui.html
    # Setting supportedSubmitMethods to an empty list is what turns off the "try it out" button
    #    supportedSubmitMethods:
    oauth:
      clientId: ${oauth.tokenprovider.clientId}
  oAuthFlow:
    authorizationUrl: ${oauth.tokenprovider.url}/oauth/authorize
    tokenUrl: ${oauth.tokenprovider.accessTokenUri}
